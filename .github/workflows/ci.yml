name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer, feat/frontend-fundacao, feature/config-mongodb-pymongo]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=src
