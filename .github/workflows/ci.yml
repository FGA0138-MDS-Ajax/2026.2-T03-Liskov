name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer, feat/frontend-fundacao, feature/config-mongodb-pymongo, xfetch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A versão do Python vem de .python-version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src/apresentacao tests/test_painel_*.py
      - run: uv run pytest --cov=src
