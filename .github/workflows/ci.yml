name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    # Inclui correções dirigidas às branches dos autores.

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI_TESTE: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      # A versão do Python vem de .python-version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run ruff check src/apresentacao tests/test_painel_*.py
      # Incremental: erros de sintaxe e nomes/imports em todas as camadas.
      - run: uv run ruff check --isolated --select F,E9 .
      - run: uv run pytest -ra --cov=src --cov-report=term-missing
